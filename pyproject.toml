[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ngfw"
dynamic = ["version"]
description = "Milanov NiceGUI framework: stranice i meni, prijava i uloge, okvir aplikacije, rezervne kopije, uređivanje šablona iz Worda"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nicegui>=3.15,<4",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
# ngfw.webdav — uređivanje fajlova (Word šablona) direktno iz desktop Worda
webdav = ["wsgidav>=4.3", "a2wsgi>=1.10", "docxtpl>=0.16"]

[project.scripts]
ngfw-demo = "ngfw.demo:main"

[project.urls]
Homepage = "https://github.com/milanpopovic/ngfw"

[tool.setuptools]
packages = ["ngfw", "ngfw.auth", "ngfw.components", "ngfw.pages", "ngfw.tree"]

[tool.setuptools.dynamic]
version = { attr = "ngfw.__version__" }
